[package]
# crates.io package id (the name `marina` is taken); the binary stays `marina`.
name = "marina-tui"
version = "0.6.0"
edition = "2021"
description = "One inbox for your coding-agent sessions (Claude Code, Codex, opencode) and the dev servers they start"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/danfry1/marina"
homepage = "https://github.com/danfry1/marina"
keywords = ["tui", "ai-agents", "claude-code", "codex", "devtools"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/demo", "/.github", "/docs", "/.agents"]

# The installed binary is `marina` regardless of the package id.
[[bin]]
name = "marina"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"          # rendering (diff buffer) + re-exports crossterm
sysinfo = "0.39"          # process cpu/mem/cwd/argv/parent (+ cpu delta math)
netstat2 = "0.11"         # listening socket -> pid
serde = { version = "1", features = ["derive"] } # config structs
serde_json = { version = "1", features = ["preserve_order"] } # package.json names; edits agents' settings without reordering them
toml = "1.1"              # parse config + Cargo.toml / pyproject.toml name
regex = "1"               # config rule matching

# Direct signalling (kill with per-pid errno) instead of shelling out to `kill`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS-only: accurate phys_footprint memory. On Linux marina falls back to RSS.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
