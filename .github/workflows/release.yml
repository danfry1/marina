name: release

# Tag a version to cut a release:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: ${{ matrix.target }}
    permissions:
      contents: write # create the GitHub Release + upload binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: tar -C "target/${{ matrix.target }}/release" -czf "marina-${{ matrix.target }}.tar.gz" marina
      - name: Attach to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: marina-${{ matrix.target }}.tar.gz

  # Token-less crates.io publish via Trusted Publishing (OIDC). Requires a
  # trusted publisher configured on crates.io for danfry1/marina + release.yml.
  publish-crate:
    name: crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the short-lived OIDC token; no stored secret
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Runs after every asset is on the release, in the same run that built them, and
  # signs build provenance for the published files. Kept separate from the build and
  # tap/bucket jobs so a problem here cannot fail or block an otherwise good release.
  # Verify a download with: gh attestation verify <file> --repo "$GITHUB_REPOSITORY"
  attest:
    name: Attest build provenance
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload SHA256SUMS to the release
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
      artifact-metadata: write # create the artifact storage record
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f -- *.sha256 checksums.txt SHA256SUMS
          sha256sum -- * > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          sha256sum -- $(ls | grep -vx SHA256SUMS) > "$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
